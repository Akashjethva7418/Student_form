<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Details</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5d6b7a;
    --line: #c9d3de;
    --accent: #1f5fa8;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: .95rem; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
  }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  input:invalid:not(:placeholder-shown) { border-color: var(--error); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #174b86; }
  #result { margin-top: 22px; display: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border: 1px solid var(--line); }
  th { width: 40%; background: var(--bg); }
  .ok { color: var(--accent); font-weight: bold; margin: 0 0 8px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Student details</h1>
    <p class="sub">Fill in all fields, then save.</p>

    <form id="studentForm" novalidate>
      <label for="name">Student name</label>
      <input type="text" id="name" name="name" placeholder=" " required
             pattern="[A-Za-z .'-]{2,}" title="Enter letters only">

      <div class="row">
        <div>
          <label for="sid">Student ID</label>
          <input type="text" id="sid" name="sid" placeholder=" " required>
        </div>
        <div>
          <label for="roll">Roll no.</label>
          <input type="number" id="roll" name="roll" placeholder=" " min="1" required>
        </div>
      </div>

      <label for="std">Standard (Std.)</label>
      <input type="text" id="std" name="std" placeholder=" " required>

      <label for="contact">Contact no.</label>
      <input type="tel" id="contact" name="contact" placeholder=" " required
             pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit number">

      <button type="submit">Save details</button>
    </form>

    <section id="result" aria-live="polite">
      <p class="ok">Details saved</p>
      <table>
        <tr><th>Name</th><td id="rName"></td></tr>
        <tr><th>Student ID</th><td id="rId"></td></tr>
        <tr><th>Roll no.</th><td id="rRoll"></td></tr>
        <tr><th>Std.</th><td id="rStd"></td></tr>
        <tr><th>Contact no.</th><td id="rContact"></td></tr>
      </table>
    </section>
  </main>

<script>
  const form = document.getElementById('studentForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    document.getElementById('rName').textContent = form.name.value.trim();
    document.getElementById('rId').textContent = form.sid.value.trim();
    document.getElementById('rRoll').textContent = form.roll.value;
    document.getElementById('rStd').textContent = form.std.value.trim();
    document.getElementById('rContact').textContent = form.contact.value;
    document.getElementById('result').style.display = 'block';
  });
</script>
</body>
</html>
